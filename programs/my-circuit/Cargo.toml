[package]
name = "my-circuit-program"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Generated by `xark export` from circuits/my-circuit: rerun it (or `xark build`)
# when the circuit changes, and this is the only thing that updates.
my-circuit-client = { path = "../../clients/my-circuit/rust" }
pinocchio = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }
