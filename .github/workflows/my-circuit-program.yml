name: my-circuit program (Pinocchio)

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_SBF_VERSION: 4.2.0
  # xark 0.5 is not published: the CLI, the crates (`.cargo/config.toml`) and
  # the npm package come from this commit. Keep them in sync with that file.
  XARK_GIT_REV: ecc0cad57fcb3967230863d90a40503939c97573

# This workflow is about one program. The workspace may hold programs from other
# frameworks, whose build and test commands differ: each program has its own
# workflow, and each step here names this one's manifest.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: The wasm32 target circuits build for
        run: rustup target add wasm32-unknown-unknown

      # xark builds from source, once, then comes from this cache.
      - name: Cached xark
        id: xark
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/xark
          key: xark-${{ runner.os }}-${{ env.XARK_GIT_REV }}

      - name: Install xark (0.5 is not on crates.io yet)
        if: steps.xark.outputs.cache-hit != 'true'
        # From the runner's temp dir: `cargo install` would otherwise load this
        # project's `.cargo/config.toml` and report its patches as unused.
        working-directory: ${{ runner.temp }}
        run: cargo install --git https://github.com/blueshift-gg/xark --rev "$XARK_GIT_REV" xark-cli --locked

      # The generated test's `circuit()` reads the circuit's `target/xark/`
      # artifacts, which are not committed: build them before the program tests.
      - name: Build the circuit artifacts the tests read
        run: xark build --check

      # It builds from source, once, then comes from this cache.
      - name: Cached tools
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-build-sbf
          key: sbf-${{ runner.os }}-${{ env.CARGO_BUILD_SBF_VERSION }}

      - name: Install cargo-build-sbf
        if: steps.tools.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: cargo install cargo-build-sbf --version "$CARGO_BUILD_SBF_VERSION" --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # @blueshift-gg/xark 0.5 is not on npm yet, and its `dist/` is built, not
      # committed: build the package from the same xark commit as the CLI and
      # install it from that directory.
      - name: Check out xark for its TypeScript package
        uses: actions/checkout@v4
        with:
          repository: blueshift-gg/xark
          ref: ${{ env.XARK_GIT_REV }}
          path: .xark

      - name: Cached @blueshift-gg/xark
        id: xark-npm
        uses: actions/cache@v4
        with:
          path: .xark/crates/wasm/dist
          key: xark-npm-${{ runner.os }}-${{ env.XARK_GIT_REV }}

      - name: Install wasm-pack
        if: steps.xark-npm.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build @blueshift-gg/xark from source
        if: steps.xark-npm.outputs.cache-hit != 'true'
        working-directory: .xark
        run: cargo xtask wasm nodejs

      - name: Install the TypeScript tests' packages
        run: |
          npm pkg set 'devDependencies.@blueshift-gg/xark=file:.xark/crates/wasm'
          npm install

      - name: Build the program
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/cargo-build-sbf.log"
          cargo build-sbf --manifest-path programs/my-circuit/Cargo.toml 2>&1 | tee "$log"
          if grep -q "overflows the maximum allowed frame space" "$log"; then
            echo "::error::a stack frame is past the SBF limit of 4 KiB (the warning above): the program would overwrite its own stack at run time. Move the big work out of line with #[inline(never)], as the generated verify is."
            exit 1
          fi

      # Only this program's LiteSVM test: `npm test` alone would run every
      # program's.
      - name: TypeScript test
        run: npm test -- tests/my-circuit.test.ts
