name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # xark 0.5 is not published: the CLI and the crates (`.cargo/config.toml`)
  # come from this commit. Keep the two in sync.
  XARK_GIT_REV: ecc0cad57fcb3967230863d90a40503939c97573

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: The wasm32 target circuits build for
        run: rustup target add wasm32-unknown-unknown

      # xark builds from source, once, then comes from this cache.
      - name: Cached xark
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/xark
          key: xark-${{ runner.os }}-${{ env.XARK_GIT_REV }}

      - name: Install xark (0.5 is not on crates.io yet)
        if: steps.tools.outputs.cache-hit != 'true'
        # From the runner's temp dir: `cargo install` would otherwise load this
        # project's `.cargo/config.toml` and report its patches as unused.
        working-directory: ${{ runner.temp }}
        run: cargo install --git https://github.com/blueshift-gg/xark --rev "$XARK_GIT_REV" xark-cli --locked

      # The committed keys and generated clients are what this source builds.
      - name: xark build --check
        run: xark build --check

      - name: xark test
        run: xark test

      # The generated verifier's self-test checks its bundled sample proof.
      - name: Test the generated verifier crates
        if: hashFiles('clients/*/rust/Cargo.toml') != ''
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          for crate in clients/*/rust; do
            [ -f "$crate/Cargo.toml" ] || continue
            cargo test --release --manifest-path "$crate/Cargo.toml"
          done
